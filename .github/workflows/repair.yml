name: Repair agent

# When a main-branch run fails, an AI agent diagnoses it, fixes the code and tests the fix.
# This workflow then pushes the branch, opens a PR and turns on auto-merge. The required `ci`
# check is the gate, and verify.yml checks production after the merge.
#
# Safety design:
# - Off unless the repo variable AGENT_ENABLED is "true" (the kill switch).
# - The agent step never sees a GitHub write token. It commits locally, and this workflow
#   does the push after the guard step checks which files changed.
# - Runs only for failures of runs on main, never for PRs or forks.
# - At most 2 repair PRs per workflow per 7 days, and none while one is open.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] gated to main-branch runs of our own workflows
    workflows: ["Daily triage", "CI", "Deploy site"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: repair-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  repair:
    name: Diagnose, fix and open PR
    if: >-
      ${{ vars.AGENT_ENABLED == 'true'
      && github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Create a scoped GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Loop breaker
        id: gate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          slug="$(printf '%s' "$WORKFLOW" | tr 'A-Z ' 'a-z-')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          since="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY_NAME" --state all --limit 100 \
            --json headRefName,createdAt,state)"
          open="$(jq --arg p "repair/$slug-" '[.[] | select(.headRefName | startswith($p)) | select(.state == "OPEN")] | length' <<<"$prs")"
          recent="$(jq --arg p "repair/$slug-" --arg s "$since" '[.[] | select(.headRefName | startswith($p)) | select(.createdAt >= $s)] | length' <<<"$prs")"
          echo "open=$open recent=$recent"
          if [ "$open" -gt 0 ]; then
            echo "A repair PR is already open for $WORKFLOW. Stopping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$recent" -ge 2 ]; then
            echo "Two repair attempts in 7 days for $WORKFLOW. Asking a human."
            gh issue create --repo "$GITHUB_REPOSITORY_NAME" \
              --title "Repair agent gave up on: $WORKFLOW" \
              --body "The repair agent already tried twice in 7 days and the failure is back. Latest failed run: $RUN_URL"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect failure context
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          mkdir -p /tmp/agent
          {
            echo "Failed workflow: $WORKFLOW"
            echo "Run: $RUN_URL"
            echo "Commit that failed: $HEAD_SHA"
          } > /tmp/agent/context.md
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY_NAME" --log-failed 2>&1 \
            | tail -n 300 | cut -c1-400 > /tmp/agent/failed.log || true
          wc -l /tmp/agent/failed.log

      - name: Prepare branch
        if: steps.gate.outputs.proceed == 'true'
        id: branch
        env:
          SLUG: ${{ steps.gate.outputs.slug }}
        run: |
          git config user.name "issue-radar-repair-agent"
          git config user.email "repair-agent@users.noreply.github.com"
          name="repair/$SLUG-$RUN_ID"
          git switch -c "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run the repair agent
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read only token. The agent cannot push or open PRs.
          github_token: ${{ github.token }}
          prompt: >-
            Follow the instructions in .github/agent/repair-prompt.md. The failure context is in
            /tmp/agent/context.md and the logs are in /tmp/agent/failed.log.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(uv sync:*),Bash(uv run:*),Bash(npm ci:*),Bash(npm test:*),Bash(npm run build:*),Bash(git add:*),Bash(git commit:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*)"
            --disallowedTools "WebFetch,WebSearch"

      - name: Guard, check what the agent changed
        if: steps.gate.outputs.proceed == 'true'
        id: guard
        env:
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Uncommitted changes left behind. Rejecting."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(git rev-parse HEAD)" = "$BASE" ]; then
            echo "Agent made no commit."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changes="$(git diff --no-renames --name-status "$BASE" HEAD)"
          echo "$changes"
          forbidden='^[AMD][[:space:]]+(\.github/|\.claude/|scripts/check_production\.py|tests/test_check_production\.py|(.*/)?CLAUDE\.md)'
          if grep -E "$forbidden" <<<"$changes"; then
            echo "Touches a protected path. Rejecting."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -E '^D[[:space:]]+tests/' <<<"$changes"; then
            echo "Deletes a test. Rejecting."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(wc -l <<<"$changes")" -gt 15 ]; then
            echo "More than 15 files changed. Rejecting."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Push, open PR and turn on auto-merge
        if: steps.gate.outputs.proceed == 'true' && steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$B64"
          git -c "http.extraheader=AUTHORIZATION: basic $B64" push origin "$BRANCH"
          {
            echo "Automated repair for a failed **$WORKFLOW** run: $RUN_URL"
            echo
            git log -1 --format=%b
            echo
            echo "Merges automatically when the required \`ci\` check passes. verify.yml then checks production."
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > /tmp/agent/pr-body.md
          url="$(gh pr create --repo "$GITHUB_REPOSITORY_NAME" --base main --head "$BRANCH" \
            --title "Repair: $(git log -1 --format=%s)" --body-file /tmp/agent/pr-body.md)"
          echo "Opened $url"
          gh pr merge "$url" --auto --squash

      - name: Tell a human when no safe fix was produced
        if: steps.gate.outputs.proceed == 'true' && steps.guard.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY_NAME" \
            --title "Repair agent could not fix: $WORKFLOW" \
            --body "No safe fix was produced for $RUN_URL. Either the cause is outside the code, or the change was rejected by the guard. See the Repair agent run for details."
