name: Daily triage

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Classify at most N new issues (leave blank for all)"
        required: false
        default: ""
      since_days:
        description: "Backfill: re-fetch issues from the last N days (1 to 7, blank for normal run)"
        required: false
        default: ""
      reclassify:
        description: "Re-ask one question for every issue in the window and overwrite its answer"
        type: choice
        options: [none, area, category, severity]
        default: none

permissions:
  contents: read

concurrency:
  group: triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Restore previous triage.json from the data branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            # Write to a temp file so a failed git show never leaves an empty triage.json behind.
            git show FETCH_HEAD:triage.json > data/triage.json.tmp
            mv data/triage.json.tmp data/triage.json
          else
            echo "No data branch yet, starting fresh"
          fi

      - name: Install dependencies
        run: uv sync --python 3.12 --frozen

      - name: Run triage
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          SINCE_DAYS: ${{ inputs.since_days }}
          RECLASSIFY: ${{ inputs.reclassify }}
        run: |
          args=()
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          if [ -n "$SINCE_DAYS" ]; then args+=(--since-days "$SINCE_DAYS"); fi
          if [ -n "$RECLASSIFY" ] && [ "$RECLASSIFY" != "none" ]; then args+=(--reclassify "$RECLASSIFY"); fi
          uv run python -m pipeline.triage --out data/triage.json "${args[@]}"

      # Runs even when some classifications failed, so the board still updates.
      # The run stays red because the step above exited non-zero.
      - name: Publish triage.json to the data branch
        if: ${{ !cancelled() && hashFiles('data/triage.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$B64"
          export GIT_AUTH_HEADER="AUTHORIZATION: basic $B64"
          bash scripts/publish_data.sh data/triage.json "https://github.com/${GITHUB_REPOSITORY}.git"

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the site deploy is
  # called explicitly. It runs even if some classifications failed, so the board still refreshes.
  deploy:
    needs: triage
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
