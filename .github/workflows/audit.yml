name: Audit

# Advisory only. Not part of the required `ci` check, so a new advisory raises a signal
# without blocking unrelated pull requests.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm audit --audit-level=high

  python:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - run: uv export --frozen --no-hashes --no-emit-project --no-dev > requirements.audit.txt
      - run: uvx pip-audit --no-deps --disable-pip -r requirements.audit.txt
